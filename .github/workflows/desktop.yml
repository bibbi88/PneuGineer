# Builds PneuGineer as a desktop app (desktop/: Electron + electron-builder) - a Windows installer
# and a Linux Flatpak. Every run keeps both as downloadable artifacts; pushing a version tag
# (v1.2.3) also publishes them on a GitHub Release.
#
#   git tag v1.0.0 && git push origin v1.0.0
#
# Can also be started by hand (Actions > Desktop apps > Run workflow), and runs when the desktop
# packaging itself changes on dev or main.
name: Desktop apps

on:
  push:
    tags: ['v*']
    branches: [dev, main]
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - name: Build the web app
        run: |
          npm ci
          npm run build
      - name: Package
        shell: bash
        run: |
          mkdir -p desktop/app
          cp dist/index.html desktop/app/index.html
          cd desktop
          npm ci
          npm pkg set version="$(../.github/desktop-version.sh)"
          npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: PneuGineer-windows
          path: desktop/release/*.exe
          if-no-files-found: error

  flatpak:
    name: Linux Flatpak
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - name: Install Flatpak tools and runtimes
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder elfutils
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub \
            org.freedesktop.Platform//25.08 \
            org.freedesktop.Sdk//25.08 \
            org.electronjs.Electron2.BaseApp//25.08
      - name: Build the web app
        run: |
          npm ci
          npm run build
      - name: Package
        run: |
          mkdir -p desktop/app
          cp dist/index.html desktop/app/index.html
          cd desktop
          npm ci
          npm pkg set version="$(../.github/desktop-version.sh)"
          npm run dist:flatpak
      - uses: actions/upload-artifact@v4
        with:
          name: PneuGineer-flatpak
          path: desktop/release/*.flatpak
          if-no-files-found: error

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, flatpak]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
