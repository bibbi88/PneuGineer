the silencer itself to change it again).`,`Arrow keys nudge the selected component; hold Shift to move a full grid step further.`,`Delete or Backspace removes the current selection.`,`Ctrl+C / Ctrl+V copies and pastes the selection.`,`Ctrl+Z undoes, Ctrl+R redoes.`,`Escape cancels a wire you’re in the middle of drawing, or clears the current selection if nothing is being drawn.`]},{heading:`Valves & flow control`,tips:[`Every 3/2 valve - push button, limit switch, air-piloted and time delay - can be switched between normally closed and normally open in the inspector. The two cells trade places, so at rest it either blocks the supply or passes 1 → 2; the actuator itself still works the same way round.`,`A 3/2 valve can be converted between push button, limit switch and air-piloted actuation, and a 5/2 or 5/3 between pneumatic and solenoid, from the inspector’s Control mode / Operation dropdown. Wires on ports the new variant also has carry over; a wire on a port it doesn’t have is dropped.`,`Exhaust ports come with a silencer fitted by default - the inspector can take it off.`,`The pressure reducing valve caps everything downstream of it at its set pressure: port and wire readouts show the reduced figure, and a cylinder behind one develops proportionally less force. It only reduces - set it at or above supply and the line stays at supply pressure.`]},{heading:`Electro-pneumatics`,tips:[`The Electrical group holds a +24 V and a 0 V supply, contacts, a push button, coils and a lamp. Electrical terminals (dark blue) only connect to other electrical terminals.`,`A coil publishes its name (e.g. Y1, K1) while energized. A solenoid valve with the same name shifts, and a contact whose "Signal" is that name (a relay contact) closes.`,`Each solenoid valve you place takes the next free Y name, so two valves never start out sharing a coil. If you rename one onto another the labels turn red - allowed, since a real circuit may drive several valves off one output, but usually a slip.`,`Set a contact’s Signal to a cylinder sensor label (e.g. A1) to use it as a position sensor.`,`The PLC has inputs I0.0-I0.3 (true while wired to +24 V), outputs Q0.0-Q0.3 (drive their terminal to +24 V when true) and L+/M supply terminals. Double-click the PLC to write its logic as a function block diagram: place signal, AND/OR/XOR/NOT, timer/counter/latch and coil blocks, then drag from a block’s output dot to another’s input dot to wire them.`,`The inspector’s "Program" field is a read-only preview of the diagram’s generated logic (e.g. "Q0.0 = (I0.0 | Q0.0) & !I0.1" for a start/stop self-hold) - edit it by double-clicking the PLC, not by typing there.`,`Wires that are connected to +24 V during a run turn amber. Hold the mouse on an electric push button to press it (Ctrl+click latches).`]},{heading:`Project info & the page frame`,tips:[`The project name sits in the toolbar. Date, author, checked by and company live in the inspector’s "Project info" section (visible with nothing selected), and all of them appear on the sheet’s title block.`,`The page frame (None/A4/A3) draws a sheet outline with that title block, centered on the current diagram when picked - a visual guide only, not a hard boundary.`]},{heading:`Exporting`,tips:[`Export (the toolbar’s download icon) opens a dialog with a live preview and a choice of what to crop to: Everything, the page frame, or whatever’s currently in view.`,`To export just part of a diagram, pan/zoom to that region first, then pick "Current view".`]}];function Nl(){let e=document.createElement(`div`);e.className=`modalBackdrop`,e.addEventListener(`click`,t=>{t.target===e&&a()});let t=document.createElement(`div`);t.className=`exportDialog tipsDialog`,e.appendChild(t);let n=document.createElement(`div`);n.className=`exportDialogHeader`;let r=document.createElement(`h2`);r.textContent=`Tips`;let i=document.createElement(`button`);i.className=`exportDialogClose`,i.textContent=`✕`,i.setAttribute(`aria-label`,`Close`),i.addEventL       </aside>
