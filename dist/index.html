iers is a button too: it resets the zoom to 100%.`,`The grid button toggles the grid and snap-to-grid together, and stays lit while they are on. It is a personal preference, remembered across projects rather than saved into one.`,`Rotate and flip apply to everything currently selected. Flip is offered for cylinders only - mirroring any other symbol would print its port labels backwards.`]},{heading:`Canvas navigation`,tips:[`Scroll to zoom in/out.`,`Middle-click drag, or Alt + drag with either outer button, to pan.`,`Drag with the left button on empty canvas to rubber-band select; hold Shift to add to the current selection rather than replace it.`,`Right-click empty canvas → Zoom to fit, the same as the toolbar button.`,`Right-click empty canvas → Paste, to drop a copy exactly where you clicked.`]},{heading:`Placing & editing`,tips:[`Drag a component from the sidebar onto the canvas, or click it to add at the view center. Placing is an edit, so the library greys out while the simulation is running - stop it first.`,`Drag a check valve, throttle valve, one-way flow control valve, quick exhaust valve, pressure reducing valve or 3/2 valve onto an existing wire (it highlights green when close enough) to splice it in, instead of dropping it unconnected on top. A 3/2 valve turns to put port 1 toward the supply and port 2 toward the consumer.`,`R turns the selected components a quarter clockwise, Shift+R counter-clockwise. It works while dragging too - a component coming out of the library or one already on the canvas - and so does a right-click with the left button still held. A valve dropped onto a wire goes in the way you turned it (along the wire), so a 3/2 valve can be turned to choose which side is the supply. Escape cancels a drag from the library.`,`The ▾ beside Open lists your five most recent files and the examples - ready-made circuits to start from, each in a new tab, like a loaded file.`,`Settings → Toolbar chooses icons with their names below, or icons only.`,`Tabs above the canvas hold several circuits at once, each with its own undo history. Click + (or the New circuit button) for a new one, double-click a tab to rename it, middle-click or × to close it, right-click for more. They are kept in the browser, so they are back after a reload. Settings (the gear) can list them in the inspector instead.`,`The lightbulb in the toolbar turns tips on: the canvas shortcuts and short explanations in the inspector. Drag the inner edge of the library or the inspector to make it wider or narrower (double-click the edge for the default width).`,`Right-click a component for Rotate, Copy, and Delete.`,`Right-click a port to add a pressure source to it, or a silencer on an exhaust port (right-click the silencer itself to change it again).`,`Arrow keys nudge the selected component; hold Shift to move a full grid step further.`,`Delete or Backspace removes the current selection.`,`Ctrl+C / Ctrl+V copies and pastes the selection.`,`Ctrl+Z undoes, Ctrl+R redoes.`,`Let a new wire go on an existing one to join it there: a junction dot is put on that wire, which stays one wire, and the dot keeps to it when things move. Where wires cross without being joined, the horizontal one jumps over the other - "Line jumps at crossings" under Project info turns that off.`,`Escape cancels a wire you’re in the middle of drawing, or clears the current selection if nothing is being drawn.`]},{heading:`Valves & flow control`,tips:[`Every 3/2 valve - push button, limit switch, air-piloted and time delay - can be switched between normally closed and normally open in the inspector. The two cells trade places, so at rest it either blocks the supply or passes 1 → 2; the actuator itself still works the same way round.`,`A 3/2 valve can be converted between push button, limit switch and air-piloted actuation from the inspector’s Control mode dropdown. Wires on ports the new variant also has carry over; a wire on a port it doesn’t have is dropped.`,`Any 5/2 or 5/3 valve shows its actuation in the inspector as a picture of the valve with a dropdown under each end: air pilot, solenoid, push button or roller (and a spring on the right for spring return). The Pilot choice makes any actuated end shift the valve only with pilot air: from port 1 (internal pilot) or from its own port X (external pilot). A 5/2 valve without a spring starts in the position chosen under "Starts in". Choose 5/3 for a spring-centred valve and pick its centre: closed (all blocked), exhausted (4→5, 2→3) or pressurized (1→4, 1→2).`,`Exhaust ports come with a silencer fitted by default - the inspector can take it off.`,`The pressure reducing valve caps everything downstream of it at its set pressure: port and wire readouts show the reduced figure, and a cylinder behind one develops proportionally less force. It only reduces - set it at or above supply and the line stays at supply pressure.`]},{heading:`Electro-pneumatics`,tips:[`The Electrical group holds a +24 V and a 0 V supply, contacts, a push button, coils and a lamp. Electrical terminals (dark blue) only connect to other electrical terminals.`,`A coil publishes its name (e.g. Y1, K1) while energized. A solenoid valve with the same name shifts, and a contact whose "Signal" is that name (a relay contact) closes.`,`Each solenoid valve you place takes the next free Y name, so two valves never start out sharing a coil. If you rename one onto another the labels turn red - allowed, since a real circuit may drive several valves off one output, but usually a slip.`,`Set a contact’s Signal to a cylinder sensor label (e.g. A1) to use it as a position sensor.`,`The PLC has inputs I0.0-I0.3 (true while wired to +24 V), outputs Q0.0-Q0.3 (drive their terminal to +24 V when true) and L+/M supply terminals. Double-click the PLC to write its logic as a function block diagram: place signal, AND/OR/XOR/NOT, timer/counter/latch and coil blocks, then drag from a block’s output dot to another’s input dot to wire them.`,`The inspector’s "Program" field is a read-only preview of the diagram’s generated logic (e.g. "Q0.0 = (I0.0 | Q0.0) & !I0.1" for a start/stop self-hold) - edit it by double-clicking the PLC, not by typing there.`,`Wires that are connected to +24 V during a run turn amber. Hold the mouse on an electric push button to press it (Ctrl+click latches).`]},{heading:`Project info & the page frame`,tips:[`The project name sits in the toolbar. Date, author, checked by and company live in the inspector’s "Project info" section (visible with nothing selected), and all of them appear on the sheet’s title block.`,`The page frame (None/A4/A3) draws a sheet outline with that title block, centered on the current diagram when picked - a visual guide only, not a hard boundary.`]},{heading:`Exporting`,tips:[`Export (the toolbar’s download icon) opens a dialog with a live preview and a choice of what to crop to: Everything, the page frame, or whatever’s currently in view.`,`To export just part of a diagram, pan/zoom to that region first, then pick "Current view".`]}];function Ey(){let e=document.createElement(`div`);e.className=`modalBackdrop`,e.addEventListener(`click`,t=>{t.target===e&&a()});let t=document.createElement(`div`);t.className=`exportDialog tipsDialog`,e.appendChild(t);let n=document.createElement(`div`);n.className=`exportDialogHeader`;let r=document.createElement(`h2`);r.textContent=`Tips`;let i=document.createElement(`button`);i.className=`exportDialogClose`,i.textContent=`✕`,i.setAttribute(`aria-label`,`Close`),i.addEventListener(`click`,()=>a()),n.append(r,i),t.appendChild(n);for(let e of Ty){let n=document.createElement(`div`);n.className=`inspectorSectionHeading`,n.textContent=e.heading,t.appendChild(n);let r=document.createElement(`ul`);r.className=`tipsList`;for(let t of e.tips){let e=document.createElement(`li`);e.textContent=t,r.appendChild(e)}t.appendChild(r)}function a(){e.remove(),window.removeEventListener(`keydown`,o)}function o(e){e.key===`Escape`&&a()}window.add
