lected. Flip is offered for cylinders only - mirroring any other symbol would print its port labels backwards.`]},{heading:`Canvas navigation`,tips:[`Scroll to zoom in/out.`,`Middle-click drag, or Alt + drag with either outer button, to pan.`,`Drag with the left button on empty canvas to rubber-band select; hold Shift to add to the current selection rather than replace it.`,`Right-click empty canvas → Zoom to fit, the same as the toolbar button.`,`Right-click empty canvas → Paste, to drop a copy exactly where you clicked.`]},{heading:`Placing & editing`,tips:[`Drag a component from the sidebar onto the canvas, or click it to add at the view center. Placing is an edit, so the library greys out while the simulation is running - stop it first.`,`Drag a check valve, throttle valve, one-way flow control valve, quick exhaust valve, pressure reducing valve or 3/2 valve onto an existing wire (it highlights green when close enough) to splice it in, instead of dropping it unconnected on top. A 3/2 valve turns to put port 1 toward the supply and port 2 toward the consumer.`,`R turns the selected components a quarter clockwise, Shift+R counter-clockwise. It works while dragging too - a component coming out of the library or one already on the canvas - and so does a right-click with the left button still held. A valve dropped onto a wire goes in the way you turned it (along the wire), so a 3/2 valve can be turned to choose which side is the supply. Escape cancels a drag from the library.`,`The Examples menu in the toolbar loads ready-made circuits to start from - each in a new tab, like a loaded file.`,`Tabs above the canvas hold several circuits at once, each with its own undo history. Click + (or the New circuit button) for a new one, double-click a tab to rename it, middle-click or × to close it, right-click for more. They are kept in the browser, so they are back after a reload. Settings (the gear) can list them in the inspector instead.`,`Right-click a component for Rotate, Copy, and Delete.`,`Right-click a port to add a pressure source to it, or a silencer on an exhaust port (right-click the silencer itself to change it again).`,`Arrow keys nudge the selected component; hold Shift to move a full grid step further.`,`Delete or Backspace removes the current selection.`,`Ctrl+C / Ctrl+V copies and pastes the selection.`,`Ctrl+Z undoes, Ctrl+R redoes.`,`Escape cancels a wire you’re in the middle of drawing, or clears the current selection if nothing is being drawn.`]},{heading:`Valves & flow control`,tips:[`Every 3/2 valve - push button, limit switch, air-piloted and time delay - can be switched between normally closed and normally open in the inspector. The two cells trade places, so at rest it either blocks the supply or passes 1 → 2; the actuator itself still works the same way round.`,`A 3/2 valve can be converted between push button, limit switch and air-piloted actuation, and a 5/2 or 5/3 between pneumatic and solenoid, from the inspector’s Control mode / Operation dropdown. Wires on ports the new variant also has carry over; a wire on a port it doesn’t have is dropped.`,`Exhaust ports come with a silencer fitted by default - the inspector can take it off.`,`The pressure reducing valve caps everything downstream of it at its set pressure: port and wire readouts show the reduced figure, and a cylinder behind one develops proportionally less force. It only reduces - set it at or above supply and the line stays at supply pressure.`]},{heading:`Electro-pneumatics`,tips:[`The Electrical group holds a +24 V and a 0 V supply, contacts, a push button, coils and a lamp. Electrical terminals (dark blue) only connect to other electrical terminals.`,`A coil publishes its name (e.g. Y1, K1) while energized. A solenoid valve with the same name shifts, and a contact whose "Signal" is that name (a relay contact) closes.`,`Each solenoid valve you place takes the next free Y name, so two valves never start out sharing a coil. If you rename one onto another the labels turn red - allowed, since a real circuit may drive several valves off one output, but usually a slip.`,`Set a contact’s Signal to a cylinder sensor label (e.g. A1) to use it as a position sensor.`,`The PLC has inputs I0.0-I0.3 (true while wired to +24 V), outputs Q0.0-Q0.3 (drive their terminal to +24 V when true) and L+/M supply terminals. Double-click the PLC to write its logic as a function block diagram: place signal, AND/OR/XOR/NOT, timer/counter/latch and coil blocks, then drag from a block’s output dot to another’s input dot to wire them.`,`The inspector’s "Program" field is a read-only preview of the diagram’s generated logic (e.g. "Q0.0 = (I0.0 | Q0.0) & !I0.1" for a start/stop self-hold) - edit it by double-clicking the PLC, not by typing there.`,`Wires that are connected to +24 V during a run turn amber. Hold the mouse on an electric push button to press it (Ctrl+click latches).`]},{heading:`Project info & the page frame`,tips:[`The project name sits in the toolbar. Date, author, checked by and company live in the inspector’s "Project info" section (visible with nothing selected), and all of them appear on the sheet’s title block.`,`The page frame (None/A4/A3) draws a sheet outline with that title block, centered on the current diagram when picked - a visual guide only, not a hard boundary.`]},{heading:`Exporting`,tips:[`Export (the toolbar’s download icon) opens a dialog with a live preview and a choice of what to crop to: Everything, the page frame, or whatever’s currently in view.`,`To export just part of a diagram, pan/zoom to that region first, then pick "Current view".`]}];function xm(){let e=document.createElement(`div`);e.className=`modalBackdrop`,e.addEventListener(`click`,t=>{t.target===e&&a()});let t=document.createElement(`div`);t.className=`exportDialog tipsDialog`,e.appendChild(t);let n=document.createElement(`div`);n.className=`exportDialogHeader`;let r=document.createElement(`h2`);r.textContent=`Tips`;let i=document.crea   <body>
    <div class="app">
      <header class="topbar" id="topbar" role="toolbar" aria-label="Main toolbar"></header>
      <nav class="tabbar" id="tabbar" role="tablist" aria-label="Open documents" hidden></nav>

      <aside class="sidebar">
        <h2>Component Library</h2>
        <div id="sidebarButtons"></div>
      </aside>

      <main class="workspace">
        <div id="gridLayer"></div>
        <div id="viewport">
          <svg id="frameLayer" class="layer"></svg>
          <svg id="connLayer" class="layer"></svg>
          <div id="compLayer" class="layer"></div>
          <svg id="handleLayer" class="layer"></svg>
        </div>
        <div class="hint">
          <span>Drag components from the sidebar onto the canvas</span>
          <span class="hintSep">·</span>
          <span><span class="hintKey">Pan</span> = Alt + left-drag, or middle-drag</span>
          <span class="hintSep">·</span>
          <span><span class="hintKey">Zoom</span> = scroll</span>
          <span class="hintSep">·</span>
          <span><span class="hintKey">Select</span> = left-drag</span>
          <span class="hintSep">·</span>
          <span><span class="hintKey">Rotate</span> = R, also while dragging</span>
        </div>
      </main>

      <aside class="inspectorPanel">
        <h2>Inspector</h2>
        <div id="inspector"></div>
      </aside>
    </div>

  </body>
</html>
