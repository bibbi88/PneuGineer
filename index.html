<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>PneuGineer</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div id="projectBar"></div>
        <hr />
        <h2>Component Library</h2>
        <div id="sidebarButtons"></div>
        <hr />
        <div id="toolbarButtons"></div>
      </aside>

      <main class="workspace">
        <div id="gridLayer"></div>
        <div id="viewport">
          <svg id="frameLayer" class="layer"></svg>
          <svg id="connLayer" class="layer"></svg>
          <div id="compLayer" class="layer"></div>
          <svg id="handleLayer" class="layer"></svg>
        </div>
        <div class="hint">Drag components from the sidebar onto the canvas.</div>
      </main>

      <aside class="inspectorPanel">
        <h2>Inspector</h2>
        <div id="inspector"></div>
      </aside>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
